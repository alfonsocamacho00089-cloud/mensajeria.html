    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #0c4064;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Mantenemos tu diseño intacto */
        .pantalla-roles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(11, 20, 26, 0.95);
            background-image: linear-gradient(rgba(11, 20, 26, 0.9), rgba(11, 20, 26, 0.9)), url('./assets/logo.webp');
            background-size: cover;
            background-position: center;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .tarjeta-roles {
            background: rgba(32, 44, 51, 0.85);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-rol {
            width: 100%;
            padding: 14px;
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            border: 1px solid #ffd700;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn-rol:active {
            transform: scale(0.98);
            background: rgba(255,215,0,0.25);
        }

        .btn-driver {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #000;
            border: none;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }

        .btn-driver:active {
            opacity: 0.9;
        }

        /* Cuadrito de clave de activación */
        #modalClavePromotor {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 100000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .caja-clave-promotor {
            background: #1b262c;
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 22px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .caja-clave-promotor input {
            width: 100%;
            padding: 12px;
            margin: 14px 0 10px;
            border-radius: 10px;
            border: 1px solid #ffd700;
            background: #0b141a;
            color: #ffd700;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .botones-clave-promotor {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .botones-clave-promotor button {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        #btnConfirmarClave {
            background: #ffd700;
            color: #000;
        }

        #btnCancelarClave {
            background: #334155;
            color: #fff;
        }

        #errorClavePromotor {
            color: #ff6b6b;
            font-size: 12px;
            min-height: 16px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="pantalla-roles">
        <div class="tarjeta-roles">
            
            
          <!-- CONTENEDOR DEL ESCUDO Y LAS LETRAS -->
<div style="text-align: center; margin-bottom: 6px;">

<!-- TÍTULO YSAPAY Y SUBTÍTULO YOUGLASS/SPACEAPP -->

<div style="text-align: center;">

    <button class="btn-rol" onclick="abrirPerfilUsuarioLocal()">

<a href="./drive.html" onclick="event.preventDefault(); pedirClavePromotor('cobro_driver');" style="display:block;background:#eab308;color:#0f172a;padding:14px;border-radius:12px;text-align:center;font-weight:800;text-decoration:none;margin-bottom:8px">🚖 Cobro Driver (Abrir)</a>
<a href="./ysapayp2p.html" onclick="event.preventDefault(); pedirClavePromotor('cobro_comercial');" style="display:block;background:#eab308;color:#0f172a;padding:14px;border-radius:12px;text-align:center;font-weight:800;text-decoration:none;margin-bottom:8px">🚖 Cobro Comercial (Abrir)</a>

    <!-- Cuadrito de clave de activación -->
    <div id="modalClavePromotor">
        <div class="caja-clave-promotor">
            <div style="font-weight:bold;color:#ffd700;font-size:16px;">Clave de Activación</div>
            <input type="password" id="inputClavePromotor" placeholder="Ingresa la clave del promotor" autocomplete="off">
            <div id="errorClavePromotor"></div>
            <div class="botones-clave-promotor">
                <button type="button" id="btnCancelarClave">Cancelar</button>
                <button type="button" id="btnConfirmarClave">Entrar</button>
            </div>
        </div>
    </div>
    
    
<script>
    const CLAVE_PROMOTOR = "2026"; // Cambia aquí la clave del promotor cuando quieras
    let accionPendientePromotor = null;

    function pedirClavePromotor(tipoAccion) {
        accionPendientePromotor = tipoAccion;
        const modal = document.getElementById('modalClavePromotor');
        const input = document.getElementById('inputClavePromotor');
        const error = document.getElementById('errorClavePromotor');

        error.textContent = "";
        input.value = "";
        modal.style.display = "flex";
        setTimeout(() => input.focus(), 50);
    }

    function cerrarModalClavePromotor() {
        accionPendientePromotor = null;
        document.getElementById('modalClavePromotor').style.display = "none";
        document.getElementById('errorClavePromotor').textContent = "";
    }

    function ejecutarAccionPromotor(tipoAccion) {
        if (tipoAccion === 'comerciante') {
            abrirPerfilComercioLocal();
        } else if (tipoAccion === 'driver') {
            abrirPerfilDriverLocal();
        } else if (tipoAccion === 'cobro_driver') {
            window.location.href = "./drive.html";
        } else if (tipoAccion === 'cobro_comercial') {
            window.location.href = "./ysapayp2p.html";
        }
    }

    document.getElementById('btnCancelarClave').addEventListener('click', cerrarModalClavePromotor);

    document.getElementById('btnConfirmarClave').addEventListener('click', function() {
        const valor = document.getElementById('inputClavePromotor').value;
        const error = document.getElementById('errorClavePromotor');

        if (valor === CLAVE_PROMOTOR) {
            const accion = accionPendientePromotor;
            cerrarModalClavePromotor();
            ejecutarAccionPromotor(accion);
        } else {
            error.textContent = "Clave incorrecta.";
        }
    });

    document.getElementById('inputClavePromotor').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('btnConfirmarClave').click();
        }
    });

   async function recuperarCuentaConID(rolElegido, urlDestino) {
    const idParaRecuperar = prompt("Escribe tu ID Dropis:");
    if (!idParaRecuperar) return;

    try {
        const snapshot = await firebase.database().ref('usuarios/' + idParaRecuperar).once('value');

        if (snapshot.exists()) {
            const datos = snapshot.val();

            // 1. Restaurar en el teléfono
            localStorage.setItem('mi_dropis_id', idParaRecuperar);
            localStorage.setItem('spaxio_rol', rolElegido);

            await guardarLocal('usuario', {
                id: 'perfil_propietario',
                dropis_id: idParaRecuperar,
                nombre: datos.nombre,
                apellido: datos.apellido,
                identificacion: datos.identificacion,
                fcm_token: datos.fcm_token || ''
            });

            alert(`✅ Bienvenido ${datos.nombre}.`);
            
            // 2. LÍNEA AGREGADA: Abrir de una vez la pantalla del perfil elegido
            window.location.href = urlDestino;

        } else {
            alert("❌ ID no encontrado en el satélite.");
        }
    } catch (e) {
        alert("Error de conexión satelital.");
    }
    }
const APP_VER = "v19"; // Solo cambias este número aquí cada vez que subas un cambio
// BOTÓN USUARIOS
function abrirPerfilUsuarioLocal() {
    const idExistente = localStorage.getItem('mi_dropis_id');
    const rolGuardado = localStorage.getItem('spaxio_rol');

    // Si ya hay un ID guardado Y el último rol era usuario, NO borramos el ID
    if (!idExistente || rolGuardado !== 'usuario') {
        localStorage.removeItem('mi_dropis_id');
    }
    
    localStorage.setItem('spaxio_rol', 'usuario');
    window.location.href = `./usuario.html?v=${APP_VER}`;
}

// BOTÓN COMERCIOS
function abrirPerfilComercioLocal() {
    const idExistente = localStorage.getItem('mi_dropis_id');
    const rolGuardado = localStorage.getItem('spaxio_rol');

    if (!idExistente || rolGuardado !== 'merchant') {
        localStorage.removeItem('mi_dropis_id');
    }
    
    localStorage.setItem('spaxio_rol', 'merchant');
    window.location.href = `./comercios.html?v=${APP_VER}`;
}

// BOTÓN DRIVER
function abrirPerfilDriverLocal() {
    const idExistente = localStorage.getItem('mi_dropis_id');
    const rolGuardado = localStorage.getItem('spaxio_rol');

    if (!idExistente || rolGuardado !== 'driver') {
        localStorage.removeItem('mi_dropis_id');
    }
    
    localStorage.setItem('spaxio_rol', 'driver');
    window.location.href = `./drivtaxi.html?v=${APP_VER}`;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')

}
