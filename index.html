<!DOCTYPE html>
<html lang="es">
<head>
    
 <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatSpace">

<link rel="apple-touch-icon" href="assets/imagen-logos-nuevos.png">
 <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>YsaPay</title>
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #0c4064;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Mantenemos tu diseño intacto */
        .pantalla-roles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(11, 20, 26, 0.95);
            background-image: linear-gradient(rgba(11, 20, 26, 0.9), rgba(11, 20, 26, 0.9)), url('./assets/logo.webp');
            background-size: cover;
            background-position: center;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .tarjeta-roles {
            background: rgba(32, 44, 51, 0.85);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-rol {
            width: 100%;
            padding: 14px;
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            border: 1px solid #ffd700;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn-rol:active {
            transform: scale(0.98);
            background: rgba(255,215,0,0.25);
        }

        .btn-driver {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #000;
            border: none;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }

        .btn-driver:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="pantalla-roles">
        <div class="tarjeta-roles">
            
            
          <!-- CONTENEDOR DEL ESCUDO Y LAS LETRAS -->
<div style="text-align: center; margin-bottom: 6px;">
    
    <!-- ESCUDO CSS (Fondo oscuro con borde dorado/verde) -->
    <div style="
        width: 110px; 
        height: 125px; 
        background: linear-gradient(135deg, #2d3b50 0%, #4668bb 100%); 
        clip-path: polygon(50% 0%, 100% 12%, 100% 65%, 50% 100%, 0% 65%, 0% 12%);
        display: flex; 
        align-items: center; 
        justify-content: center; 
        margin: 0 auto;
        position: relative;
        filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.8));
    ">
        
        <!-- Borde interno decorativo del escudo -->
        <div style="
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            background: linear-gradient(180deg, #181d24 0%, #0b141a 100%);
            clip-path: polygon(50% 0%, 100% 12%, 100% 65%, 50% 100%, 0% 65%, 0% 12%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
        ">

            <!-- TUS LETRAS EXACTAS EN EL CENTRO -->
            <div style="display: flex; align-items: flex-end; line-height: 0.8; margin-left: 5px;">
                <!-- Letra Y -->
                <span style="font-family: sans-serif; font-size: 55px; font-weight: 900; background: linear-gradient(180deg, #ffea75 0%, #ffd700 50%, #b8860b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.5));">Y</span>
                
                <!-- Letra P -->
                <span style="font-family: sans-serif; font-size: 42px; font-weight: 900; background: linear-gradient(180deg, #00ffcc 0%, #00b377 50%, #004d33 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-left: -6px; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.5));">P</span>
            </div>

        </div>
    </div>

</div>

<!-- TÍTULO YSAPAY Y SUBTÍTULO YOUGLASS/SPACEAPP -->
<div style="text-align: center; margin-top: 10px; margin-bottom: 25px;">
    
    <!-- Título Principal -->
    <h2 style="font-family: sans-serif; font-size: 50px; font-weight: 900; text-transform: none; letter-spacing: 0.5px; margin: 0; display: inline-block;">
        <span style="background: linear-gradient(180deg, #ffea75 0%, #ffd700 50%, #b8860b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Ysa</span><span style="background: linear-gradient(180deg, #00ffcc 0%, #00b377 50%, #004d33 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Pay</span>
    </h2>

    <!-- Subtítulo -->
    <p style="color: #8696a0; font-size: 12px; margin: 0; padding: 0; letter-spacing: 1px;">YouSpaceApp</p>

</div>
<!-- Botón dinámico para instalar la PWA en el celular -->
    <button id="btnInstalar" class="btn-rol" style="display: none; margin-top: 15px; background: linear-gradient(135deg, #00ffcc 0%, #00b377 100%); color: #000; border: none;">
        📥 Instalar Aplicación
    </button>
<!-- SECCIÓN DE BOTONES DE ROLES -->
<div style="text-align: center;">
    <p style="color: #8696a0; font-size: 13px; margin-bottom: 25px;">Elige tu perfil principal para configurar tu espacio:</p>
    
    <!-- Botón Usuario / Pasajero -->
    <button class="btn-rol" onclick="abrirPerfilUsuarioLocal('passenger')">
        👤 Soy Usuario 
    </button>

    <!-- Botón Comerciante -->
    <button class="btn-rol" onclick="abrirPerfilComercioLocal('merchant')">
        🏬 Soy Comerciante
    </button>

    <!-- Botón Conductor (Driver) -->
    <button class="btn-rol btn-driver" onclick="abrirPerfilDriverLocal('driver')">
        🚖 Soy Driver 
    </button>
</div>

    <script>
       // Al hacer clic en el botón de Comercio:
function abrirPerfilUsuarioLocal() {
    // 1. Limpiamos temporalmente el ID activo para forzar un registro nuevo
    localStorage.removeItem('mi_dropis_id');
    localStorage.setItem('spaxio_rol', 'usuario');
    
    // 2. Abrimos tu archivo local limpio dentro de la misma app (sin pestañas de Google)
    window.location.href = "./usuario.html";
}
        // Al hacer clic en el botón de Comercio:
function abrirPerfilComercioLocal() {
    // 1. Limpiamos temporalmente el ID activo para forzar un registro nuevo
    localStorage.removeItem('mi_dropis_id');
    localStorage.setItem('spaxio_rol', 'merchant');
    
    // 2. Abrimos tu archivo local limpio dentro de la misma app (sin pestañas de Google)
    window.location.href = "./comercios.html";
}

// Al hacer clic en el botón de Driver:
function abrirPerfilDriverLocal() {
    localStorage.removeItem('mi_dropis_id');
    localStorage.setItem('spaxio_rol', 'driver');
    
    window.location.href = "./drivtaxi.html";
}
        
        
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(() => console.log("Service Worker registrado con éxito"))
    .catch((err) => console.log("Error al registrar Service Worker", err));
             }
     
        
    </script>

</body>
</html>
