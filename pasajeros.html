<!DOCTYPE html>
<html lang="es">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatSpace">


 <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>YsaPay Driver Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0b0f19;color:#f8fafc;padding:14px;padding-bottom:70px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid #1e293b;padding-bottom:10px}
.br{font-size:1.2rem;font-weight:800;color:#38bdf8}
.bdg{background:#064e3b;color:#34d399;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:#1e293b;padding:12px;border-radius:12px;text-align:center}
.sn{font-size:1.5rem;font-weight:800;color:#facc15}
.sl{font-size:.75rem;color:#94a3b8}
.btn{border:none;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer;width:100%;margin-bottom:10px}
.btn:active{transform:scale(.98)}
.b-qr{background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;font-size:1.1rem}
.b-ad{background:#10b981;color:#022c22}
.b-sm{padding:8px 12px;font-size:.85rem;width:auto;border-radius:8px;margin:0}
.b-cb{background:#3b82f6;color:#fff}
.b-rc{background:#eab308;color:#1e293b}
#cam{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;display:none;background:#000;border:2px solid #38bdf8}
video{width:100%;display:block}
#alt{display:none;padding:14px;border-radius:12px;text-align:center;margin-bottom:14px;font-weight:700}
.ok{background:#065f46;border:2px solid #10b981;color:#ecfdf5}
.er{background:#7f1d1d;border:2px solid #ef4444;color:#fef2f2}
.sb{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:1rem;margin-bottom:14px}
.tt{font-size:.85rem;color:#94a3b8;margin-bottom:8px;text-transform:uppercase}
.cd{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #38bdf8}
.cd.low{border-left-color:#f97316}
.cd.emp{border-left-color:#ef4444;opacity:.8}
.nm{font-weight:700;font-size:1rem}
.id{font-size:.8rem;color:#94a3b8;font-family:monospace}
.cr{font-size:1.05rem;font-weight:800;color:#34d399;margin-top:3px}
.cr.low{color:#fb923c}
.cr.emp{color:#f87171}
.ac{display:flex;gap:6px;flex-direction:column}
.md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:16px;z-index:50}
.mc{background:#1e293b;padding:18px;border-radius:16px;width:100%;max-width:380px}
.mc h3{margin-bottom:12px;color:#38bdf8}
.ig{margin-bottom:10px}
.ig label{display:block;font-size:.85rem;color:#cbd5e1;margin-bottom:4px}
.ig input{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:1rem}
.mb{display:flex;gap:10px;margin-top:14px}
</style>
</head>
<body>
<div class="hd"><div class="br">🚖 YsaPay Driver</div><div class="bdg">● 100% OFFLINE</div></div>
<div class="st">
  <div class="sc"><div class="sn" id="sv">0</div><div class="sl">Pasajes Hoy</div></div>
  <div class="sc"><div class="sn" id="su">0</div><div class="sl">Afiliados</div></div>
</div>
<div id="alt"></div>
<button class="btn b-qr" onclick="toggleCam()">📷 Escanear QR Pasajero</button>
<div id="cam"><video id="vid" playsinline></video></div>
<button class="btn b-ad" onclick="abrirModal()">+ Registrar ID / Vender 30 Días</button>
<input type="text" id="bus" class="sb" placeholder="🔍 Buscar por ID (ej: YSA-01) o nombre..." oninput="render()">
<div class="tt">Cartera de Pasajeros (Créditos en tu unidad)</div>
<div id="lst"></div>

<div class="md" id="mod">
  <div class="mc">
    <h3 id="mt">Registrar Pasajero</h3>
    <div class="ig"><label>ID Tarjeta (Ej: YSA-104)</label><input type="text" id="iid" placeholder="YSA-104"></div>
    <div class="ig"><label>Nombre Pasajero</label><input type="text" id="inm" placeholder="Carlos Pérez"></div>
    <div class="ig"><label>Pasajes a cargar (30 días = 60)</label><input type="number" id="icr" value="60"></div>
    <div class="mb">
      <button class="btn" style="background:#475569;color:#fff;margin:0" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" style="background:#10b981;color:#022c22;margin:0" onclick="guardarPas()">Guardar</button>
    </div>
  </div>
</div>

<script>
let db=JSON.parse(localStorage.getItem('ysapay_db'))||[{id:'YSA-001',nombre:'María Gómez',creditos:28},{id:'YSA-002',nombre:'Luis Rojas',creditos:2}];
let hoy=parseInt(localStorage.getItem('ysapay_hoy'))||0;
let strm=null,intv=null;

function save(){localStorage.setItem('ysapay_db',JSON.stringify(db));localStorage.setItem('ysapay_hoy',hoy);render();}

function render(){
  const f=document.getElementById('bus').value.toLowerCase();
  const l=document.getElementById('lst');l.innerHTML='';
  document.getElementById('sv').innerText=hoy;
  document.getElementById('su').innerText=db.length;
  db.filter(p=>p.id.toLowerCase().includes(f)||p.nombre.toLowerCase().includes(f)).forEach(p=>{
    const c=p.creditos===0?'emp':(p.creditos<=3?'low':'');
    l.innerHTML+=`<div class="cd ${c}"><div><div class="nm">${p.nombre}</div><div class="id">ID: ${p.id}</div><div class="cr ${c}">${p.creditos} pasajes</div></div><div class="ac"><button class="btn b-sm b-cb" onclick="cobrar('${p.id}')">-1 Viaje</button><button class="btn b-sm b-rc" onclick="recargar('${p.id}')">+ Recargar</button></div></div>`;
  });
}

function beep(ok){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator();o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(ok?880:220,ctx.currentTime);o.connect(ctx.destination);o.start();o.stop(ctx.currentTime+(ok?.15:.4));}catch(e){}
}

function alertar(msg,ok){
  const a=document.getElementById('alt');a.className=ok?'ok':'er';a.innerHTML=msg;a.style.display='block';beep(ok);
  setTimeout(()=>{a.style.display='none'},3500);
}

function cobrar(rawId){
  const id=rawId.trim().toUpperCase();
  const i=db.findIndex(p=>p.id.toUpperCase()===id);
  if(i===-1)return alertar(`❌ ID "${id}" no registrado.`,false);
  if(db[i].creditos<=0)return alertar(`⚠️ ${db[i].nombre} (${id}) tiene 0 pasajes.`,false);
  db[i].creditos-=1;hoy+=1;save();
  alertar(`✅ COBRADO: ${db[i].nombre}<br>Quedan: <b>${db[i].creditos} viajes</b>${db[i].creditos<=3?'<br>⚠️ ¡Por vencer!':''}`,true);
}

async function toggleCam(){
  const c=document.getElementById('cam'),v=document.getElementById('vid');
  if(strm)return stopCam();
  try{
    strm=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=strm;await v.play();c.style.display='block';
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['qr_code']});
      intv=setInterval(async()=>{try{const r=await det.detect(v);if(r.length>0){const val=r[0].rawValue;stopCam();cobrar(val);}}catch(e){}},400);
    }else alertar('ℹ️ Usa el buscador de ID abajo.',false);
  }catch(e){alertar('❌ Sin permiso de cámara.',false);}
}

function stopCam(){
  if(intv)clearInterval(intv);if(strm)strm.getTracks().forEach(t=>t.stop());
  strm=null;document.getElementById('cam').style.display='none';
}

function abrirModal(){
  document.getElementById('mt').innerText='Registrar ID / Vender Mes';
  document.getElementById('iid').value='';document.getElementById('iid').disabled=false;
  document.getElementById('inm').value='';document.getElementById('icr').value='60';
  document.getElementById('mod').style.display='flex';
}

function recargar(id){
  const p=db.find(x=>x.id===id);if(!p)return;
  document.getElementById('mt').innerText='Recargar Pasajes';
  document.getElementById('iid').value=p.id;document.getElementById('iid').disabled=true;
  document.getElementById('inm').value=p.nombre;document.getElementById('icr').value='60';
  document.getElementById('mod').style.display='flex';
}

function cerrarModal(){document.getElementById('mod').style.display='none';}

function guardarPas(){
  const id=document.getElementById('iid').value.trim().toUpperCase();
  const nombre=document.getElementById('inm').value.trim();
  const creditos=parseInt(document.getElementById('icr').value)||0;
  if(!id||!nombre)return alert('Completa ID y Nombre');
  const i=db.findIndex(p=>p.id===id);
  if(i>=0){db[i].nombre=nombre;db[i].creditos+=creditos;}else db.push({id,nombre,creditos});
  cerrarModal();save();alertar(`✅ +${creditos} pasajes cargados a ${nombre}`,true);
}

render();

  if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(() => console.log("Service Worker registrado con éxito"))
    .catch((err) => console.log("Error al registrar Service Worker", err));
  }
</script>
</body>
</html>
