<script>
let db = JSON.parse(localStorage.getItem('ysapay_comercio_db')) || [
  {id:'YSA-001', nombre:'María Gómez', saldo:1000},
  {id:'YSA-002', nombre:'Luis Rojas', saldo:150}
];
let vendidoHoy = parseFloat(localStorage.getItem('ysapay_comercio_hoy')) || 0;
let strm = null, intv = null, canvasDet = null;
let idResaltado = '';

function fmtMonto(n){
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

function save(){
  localStorage.setItem('ysapay_comercio_db', JSON.stringify(db));
  localStorage.setItem('ysapay_comercio_hoy', String(vendidoHoy));
  render();
}

function render(){
  const f = document.getElementById('bus').value.trim().toLowerCase();
  const l = document.getElementById('lst');
  l.innerHTML = '';
  document.getElementById('sv').innerText = fmtMonto(vendidoHoy);
  document.getElementById('su').innerText = db.length;

  const filtrados = db.filter(p =>
    p.id.toLowerCase().includes(f) || p.nombre.toLowerCase().includes(f)
  );

  if (filtrados.length === 0) {
    l.innerHTML = `<div class="cd"><div><div class="nm">Sin resultados para "${f}"</div><div class="id">Puedes registrarlo con el botón verde</div></div></div>`;
    return;
  }

  filtrados.forEach(p => {
    const c = p.saldo <= 0 ? 'emp' : (p.saldo <= 100 ? 'low' : '');
    const esEncontrado = idResaltado && String(p.id).trim() === String(idResaltado).trim();
    const safeId = p.id.replace(/[^a-zA-Z0-9_-]/g, '_');
    l.innerHTML += `
      <div class="cd ${c} ${esEncontrado ? 'found' : ''}" id="card_${safeId}">
        <div>
          <span class="x-esquina" onclick="eliminarCli('${p.id}')" title="Eliminar">✕</span>
<div class="nm">${p.nombre}</div>
          <div class="id">ID: ${p.id}</div>
          <div class="cr ${c}">Saldo: ${fmtMonto(p.saldo)}</div>
        </div>
        <div class="ac">
          <div class="cob-box">
            <input type="number" step="any" min="0.01" class="m-inp" id="m_${safeId}" placeholder="120">
            <button class="btn b-sm b-cb" onclick="cobrarMonto('${p.id}', '${safeId}')">Cobrar</button>
          </div>
          <button class="btn b-sm b-rc" onclick="recargar('${p.id}')">+ Recargar</button>
        </div>
      </div>`;
  });
}
function eliminarCli(rawId){
  const id = String(rawId || '').trim();
  const i = db.findIndex(p => String(p.id).trim() === id);
  if (i === -1) return;
  if (String(idResaltado).trim() === id) idResaltado = '';
  db.splice(i, 1);
  save();
      }
function limpiarBusqueda(){
  idResaltado = '';
  document.getElementById('bus').value = '';
  render();
}

function buscarIDDesdeQR(rawId){
  const idLimpio = String(rawId || '').trim();
  if (!idLimpio) return;

  const inputBus = document.getElementById('bus');
  inputBus.value = idLimpio;
  idResaltado = idLimpio;
  render();

  const cliente = db.find(p => String(p.id).trim() === idLimpio);
  if (cliente) {
    alertar(`👤 Cliente: <b>${cliente.nombre}</b><br>ID: <b>${cliente.id}</b> · Saldo: <b>${fmtMonto(cliente.saldo)}</b>`, true);
    const safeId = cliente.id.replace(/[^a-zA-Z0-9_-]/g, '_');
    const inpMonto = document.getElementById(`m_${safeId}`);
    if (inpMonto) {
      inpMonto.scrollIntoView({behavior:'smooth', block:'center'});
      setTimeout(() => inpMonto.focus(), 200);
    }
  } else {
    alertar(`🔍 ID escaneado: <b>${idLimpio}</b> (no está registrado aún)`, false);
  }
}

function beep(ok){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    o.type = ok ? 'sine' : 'sawtooth';
    o.frequency.setValueAtTime(ok ? 880 : 220, ctx.currentTime);
    o.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + (ok ? .15 : .4));
  }catch(e){}
}

function alertar(msg, ok){
  const a = document.getElementById('alt');
  a.className = ok ? 'ok' : 'er';
  a.innerHTML = msg;
  a.style.display = 'block';
  beep(ok);
  setTimeout(() => { a.style.display = 'none'; }, 3500);
}

}

async function cargarProto() {
  const schema = `
    package superapp;
    syntax = "proto3";
    message SuperAppPayload {
      string chatText = 1;
      string msgId = 2;
      uint32 tipo = 3;
      bytes archivoData = 4;
      uint32 piezaActual = 5;
      uint32 totalPiezas = 6;
    }
  `;
  return protobuf.parse(schema).root;
  }
function cobrarMonto(rawId, safeId){
  const id = String(rawId || '').trim();
  const inp = document.getElementById(`m_${safeId}`);
  const monto = parseFloat(inp ? inp.value : 0);

  if (!monto || monto <= 0) {
    if (inp) inp.focus();
    return alertar('⚠️ Escribe un monto mayor a 0 para descontar.', false);
  }

  const i = db.findIndex(p => String(p.id).trim() === id);
  if (i === -1) return alertar(`❌ ID "${id}" no registrado.`, false);
  if (db[i].saldo < monto) {
    return alertar(`⚠️ Saldo insuficiente para ${db[i].nombre}.<br>Tiene <b>${fmtMonto(db[i].saldo)}</b> y pidió <b>${fmtMonto(monto)}</b>.`, false);
  }

  db[i].saldo = Number((db[i].saldo - monto).toFixed(2));
  vendidoHoy = Number((vendidoHoy + monto).toFixed(2));
  save();

  enviarAvisoSaldoPorCanalFirebase(id, 'COBRO', monto);
  alertar(`✅ COBRADO ${fmtMonto(monto)} a ${db[i].nombre}<br>Saldo restante: <b>${fmtMonto(db[i].saldo)}</b>`, true);

  const miID = obtenerMiIDComercio();
if (miID) {
  const claveSaldo = 'spaxio_saldo_' + miID;
  const actualComercio = Number(((parseFloat(localStorage.getItem(claveSaldo) || localStorage.getItem('spaxio_saldo_actual') || '0') || 0) + monto).toFixed(2));
  sincronizarSaldoComercioNube(actualComercio);
}
}


async function toggleCam(){
  const c = document.getElementById('cam'), v = document.getElementById('vid');
  if (strm) return stopCam();
  try{
    strm = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject = strm;
    await v.play();
    c.style.display = 'block';

    const usaBarcodeDetector = ('BarcodeDetector' in window);
    const detector = usaBarcodeDetector ? new BarcodeDetector({formats:['qr_code']}) : null;

    intv = setInterval(async () => {
      if (v.readyState < 2) return;
      try{
        let valorQR = null;
        if (detector) {
          const r = await detector.detect(v);
          if (r.length > 0) valorQR = r[0].rawValue;
        } else if (typeof jsQR === 'function') {
          if (!canvasDet) canvasDet = document.createElement('canvas');
          canvasDet.width = v.videoWidth;
          canvasDet.height = v.videoHeight;
          const ctx = canvasDet.getContext('2d');
          ctx.drawImage(v, 0, 0, canvasDet.width, canvasDet.height);
          const imgData = ctx.getImageData(0, 0, canvasDet.width, canvasDet.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height);
          if (code && code.data) valorQR = code.data;
        }
        if (valorQR) {
          stopCam();
          buscarIDDesdeQR(valorQR);
        }
      }catch(e){}
    }, 350);
  }catch(e){
    alertar('❌ Sin permiso de cámara.', false);
  }
}

function stopCam(){
  if (intv) clearInterval(intv);
  if (strm) strm.getTracks().forEach(t => t.stop());
  strm = null; intv = null;
  document.getElementById('cam').style.display = 'none';
}

function procesarQRGaleria(input){
  if (!input.files || !input.files[0]) return;
  const archivo = input.files[0];
  const lector = new FileReader();

  lector.onload = function(e){
    const imagen = new Image();
    imagen.src = e.target.result;
    imagen.onload = function(){
      const canvas = document.createElement('canvas');
      const contexto = canvas.getContext('2d');
      canvas.width = imagen.width;
      canvas.height = imagen.height;
      contexto.drawImage(imagen, 0, 0, canvas.width, canvas.height);
      const datosImagen = contexto.getImageData(0, 0, canvas.width, canvas.height);
      const codigoQR = jsQR(datosImagen.data, datosImagen.width, datosImagen.height);

      if (codigoQR && codigoQR.data) {
        buscarIDDesdeQR(codigoQR.data);
      } else {
        alertar('❌ No se pudo descifrar el QR de la imagen.', false);
      }
    };
  };
  lector.readAsDataURL(archivo);
  input.value = '';
}

function abrirModal(){
  document.getElementById('mt').innerText = 'Registrar Cliente / Cargar Saldo';
  document.getElementById('iid').value = '';
  document.getElementById('iid').disabled = false;
  document.getElementById('inm').value = '';
  document.getElementById('icr').value = '1000';
  document.getElementById('mod').style.display = 'flex';
}
  

function sincronizarConUserTarjetas(idTarjeta, montoSumado, descontarDePrincipal = false) {
  const idLimpio = String(idTarjeta || '').trim();
  const monto = parseFloat(montoSumado) || 0;
  if (!idLimpio || monto <= 0) return true;

  const miID = String(localStorage.getItem('mi_dropis_id') || '').trim();
  const clavePrincipal = miID ? `spaxio_saldo_${miID}` : 'spaxio_saldo_actual';

  if (descontarDePrincipal) {
    let saldoPrincipal = parseFloat(localStorage.getItem(clavePrincipal) || '0') || 0;
    if (saldoPrincipal < monto) {
      if (typeof alertar === 'function') {
        alertar('⚠️ Saldo insuficiente en la cuenta principal', false);
      } else {
        alert('⚠️ Saldo insuficiente en la cuenta principal');
      }
      return false;
    }

    saldoPrincipal = Number((saldoPrincipal - monto).toFixed(2));
    localStorage.setItem(clavePrincipal, saldoPrincipal.toFixed(2));
    localStorage.setItem('spaxio_saldo_actual', saldoPrincipal.toFixed(2));
    localStorage.setItem('saldo_principal', saldoPrincipal.toFixed(2));
  }

  let tarjetas = JSON.parse(localStorage.getItem('user_tarjetas') || '[]');
  let encontrada = false;

  tarjetas = tarjetas.map(t => {
    if (String(t.id || '').trim() === idLimpio) {
      const actual = parseFloat(t.saldo || '0') || 0;
      t.saldo = (actual + monto).toFixed(2);
      encontrada = true;
    }
    return t;
  });

  if (!encontrada) {
    tarjetas.push({
      id: idLimpio,
      saldo: monto.toFixed(2)
    });
  }

  localStorage.setItem('user_tarjetas', JSON.stringify(tarjetas));

  }
  
function procesarCobroComercial(monto, idReceptorParam = null) {
  const valor = parseFloat(monto) || 0;
  if (valor <= 0) return false;

  const miID = String(localStorage.getItem('mi_dropis_id') || '').trim();
  const clavePrincipal = miID ? `spaxio_saldo_${miID}` : 'spaxio_saldo_actual';

  const inputReceptor = document.getElementById('idReceptor');
  const idDestino = String(
    idReceptorParam || (inputReceptor ? inputReceptor.value : '') || ''
  ).trim();

  let saldoActual = parseFloat(localStorage.getItem(clavePrincipal) || '0') || 0;
  saldoActual = Number((saldoActual + valor).toFixed(2));

  localStorage.setItem(clavePrincipal, saldoActual.toFixed(2));
  localStorage.setItem('spaxio_saldo_actual', saldoActual.toFixed(2));
  localStorage.setItem('saldo_principal', saldoActual.toFixed(2));

  if (idDestino) {
    sincronizarConUserTarjetas(idDestino, valor, false);
  }

  const elBalance = document.getElementById('balanceVisual');
  if (elBalance) {
    elBalance.innerText = "Bs. " + saldoActual.toLocaleString('es-VE', { minimumFractionDigits: 2 });
  }

  return true;
}
function obtenerMiIDComercio() {
  return String(localStorage.getItem('mi_dropis_id') || '').trim();
}

function recuperarSaldoComercioDesdeNube() {
  const miID = obtenerMiIDComercio();
  if (!miID || typeof firebase === 'undefined' || !firebase.apps?.length) return;

  firebase.database().ref('spaxio_saldo_actual/' + miID).once('value').then((snap) => {
    if (!snap.exists()) return;
    const data = snap.val();
    const saldoNube = Number(typeof data === 'object' ? data.saldo : data) || 0;

    localStorage.setItem('spaxio_saldo_' + miID, saldoNube.toFixed(2));
    localStorage.setItem('spaxio_saldo_actual', saldoNube.toFixed(2));
    localStorage.setItem('saldo_principal', saldoNube.toFixed(2));

    if (typeof sincronizarInterfazSaldos === 'function') {
      sincronizarInterfazSaldos();
    }
  }).catch((err) => {
    console.error('❌ Error recuperando saldo comercio desde Firebase:', err);
  });
}

function sincronizarSaldoComercioNube(nuevoSaldo) {
  const miID = obtenerMiIDComercio();
  const valorLimpio = Number(nuevoSaldo) || 0;

  localStorage.setItem('spaxio_saldo_actual', valorLimpio.toFixed(2));
  localStorage.setItem('saldo_principal', valorLimpio.toFixed(2));
  if (miID) {
    localStorage.setItem('spaxio_saldo_' + miID, valorLimpio.toFixed(2));
  }

  if (!miID || typeof firebase === 'undefined' || !firebase.apps?.length) return;

  return firebase.database().ref('spaxio_saldo_actual/' + miID).update({
    saldo: valorLimpio,
    id_usuario: miID,
    actualizadoEn: Date.now()
  }).catch((err) => {
    console.error('❌ Error sincronizando saldo comercio en Firebase:', err);
  });
    }
  function eliminarCli(rawId){
  const id = String(rawId || '').trim();
  const i = db.findIndex(p => String(p.id).trim() === id);
  if (i === -1) return;
  const nombre = db[i].nombre;
  if (!confirm(`¿Eliminar a ${nombre} (${db[i].id}) de la lista?`)) return;
  if (String(idResaltado).trim() === id) idResaltado = '';
  db.splice(i, 1);

  alertar(`🗑️ Eliminado ${nombre}`, true);

  async function enviarAvisoSaldoPorCanalFirebase(idDestino, tipo, monto, refCodigo) {

  const valor = parseFloat(monto) || 0;
  if (!destinoLimpio || valor <= 0) return false;
  if (typeof firebase === 'undefined' || !firebase.apps?.length || typeof cargarProto !== 'function') return false;

  const miID = localStorage.getItem('mi_dropis_id') || "COMERCIO-YSAPAY";
  const codigo = refCodigo || ((tipo === 'SUMA' ? "REC-" : "COB-") + Math.floor(100000 + Math.random() * 900000));
  const etiqueta = tipo === 'SUMA' ? `|SPA_SUMA|${valor}|${codigo}` : `|SPA_COBRO|${valor}|${codigo}`;
  const textoAviso = tipo === 'SUMA'
    ? `💳 ¡Recarga recibida! Te cargaron ${valor.toFixed(2)} (Ref: ${codigo}) ${etiqueta}`
    : `🧾 ¡Cobro en comercio! Se descontaron ${valor.toFixed(2)} (Ref: ${codigo}) ${etiqueta}`;

  const msgId = "msg_saldo_" + Date.now();
  const root = await cargarProto();
  const SuperAppPayload = root.lookupType("SuperAppPayload");
  const msgProtegido = btoa(unescape(encodeURIComponent(textoAviso)));
  const payload = SuperAppPayload.create({ chatText: msgProtegido, msgId: msgId, tipo: 0 });
  const buffer = SuperAppPayload.encode(payload).finish();

  let binary = "";
  for (let i = 0; i < buffer.byteLength; i++) {
    binary += String.fromCharCode(buffer[i]);
  }
  const base64 = btoa(binary);

  await firebase.database().ref('cola_satelital/' + destinoLimpio).push({
    p: base64,
    from: miID,
    ts: Date.now(),
    msgId: msgId,
    mediaType: 'texto'
  });

  return true;
  }
function recargar(id){
  const p = db.find(x => x.id === id);
  if (!p) return;
  document.getElementById('mt').innerText = 'Recargar Saldo';
  document.getElementById('iid').value = p.id;
  document.getElementById('iid').disabled = true;
  document.getElementById('inm').value = p.nombre;
  document.getElementById('icr').value = '1000';
  document.getElementById('mod').style.display = 'flex';
}

function cerrarModal(){
  document.getElementById('mod').style.display = 'none';
}

function guardarCli(){
  const id = document.getElementById('iid').value.trim();
  const nombre = document.getElementById('inm').value.trim();
  const monto = parseFloat(document.getElementById('icr').value) || 0;
  if (!id || !nombre) return alert('Completa ID y Nombre');

  const i = db.findIndex(p => String(p.id).trim() === id);
  if (i >= 0) {
    db[i].nombre = nombre;
    db[i].saldo = Number((db[i].saldo + monto).toFixed(2));
  } else {
    db.push({id, nombre, saldo: Number(monto.toFixed(2))});
  }

  cerrarModal();
  save();

  enviarAvisoSaldoPorCanalFirebase(id, 'SUMA', monto);
  alertar(`✅ +${fmtMonto(monto)} cargados a ${nombre}`, true);
}
  if (navigator.onLine) {
  recuperarSaldoComercioDesdeNube();
  }
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
